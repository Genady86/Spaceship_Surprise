<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traumschiff Surprise</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main class="app">
      <header class="app-header">
        <p class="kennung">MISSION CONTROL</p>
        <h1>Das Traumschiff Surprise</h1>
        <p class="hinweis">
          Verwalte dein Raumschiff, kaufe Ausrüstung und überstehe den Flug.
        </p>
      </header>
      <!-- Javascript fügt die Tabelle hier ein -->
      <section id="status" class="status" aria-label="Raumschiffstatus"></section>

      <div class="steuerungs-grid">
        <section class="steuerung">
          <h2>Schaden</h2>
          <label for="damageInput">Höhe des Schadens</label>
          <input id="damageInput" type="number" min="1" step="1" value="20">
          <button type="button" onclick="takeDamage()">
            Schaden nehmen
          </button>
        </section>

        <section class="steuerung">
          <h2>Repairkits</h2>
          <label for="repairkitInput">Anzahl der Repairkits</label>
          <input id="repairkitInput" type="number" min="1" step="1" value="1">
          <button type="button" onclick="buyRepairkits()">
            Repairkits kaufen
          </button>
          <button type="button" class="sekundaer" onclick="useRepairkit()">
            Ein Repairkit benutzen
          </button>
        </section>

        <section class="steuerung">
          <h2>Schutzschild</h2>
          <p class="steuerungs-text">
            Ein Schild kostet 50 Diamonds und halbiert erlittenen Schaden.
          </p>
          <button type="button" onclick="buyShield()">
            Schild kaufen
          </button>
        </section>
      </div>

      <section class="meldungsbereich" aria-label="Meldungen">
        <p id="meldung" aria-live="polite">
          Das Raumschiff ist bereit.
        </p>
        <p id="error" role="alert" aria-live="assertive"></p>
      </section>

      <button type="button" class="reset-button" onclick="resetGame()">
        Spiel zurücksetzen
      </button>
    </main>

    <script src="script.js"></script>
  </body>

</html>
